plugins {
    id "com.android.application"
}

def repoRoot = rootProject.projectDir.parentFile

android {
    namespace = "com.lasrecomp.android"
    compileSdk = 36
    ndkVersion = "29.0.14206865"

    defaultConfig {
        applicationId = "com.lasrecomp.android"
        minSdk = 33
        targetSdk = 36
        versionCode = 1
        versionName = "0.1-poc"

        ndk {
            abiFilters += ["arm64-v8a", "x86_64"]
        }
        externalNativeBuild {
            cmake {
                arguments += ["-DANDROID_PLATFORM=android-33", "-DANDROID_STL=c++_static"]
            }
        }
    }

    sourceSets {
        main {
            java.srcDir("${repoRoot}/build/android-deps/SDL/android-project/app/src/main/java")
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    packaging {
        jniLibs.useLegacyPackaging = true
    }
}
